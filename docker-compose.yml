services: # Serviços a serem executados
  placeintime:
    build: . # Build da imagem dockerfile
    ports:
      - "3030:8080" # Porta do host e container
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - APP_NAME=PlaceInTime
      - SERVER_ENVIRONMENT=docker
      - SERVER_VERSION=1.0.0
      - DATABASE_URL=jdbc:postgresql://postgres:5432/placeintime
      - DB_USER=placeintime_user
      - DB_PASS=placeintime_pass
    #restart: unless-stopped # Reinicia o container se ele cair
    container_name: placeintime-backend
    depends_on:
      - postgres
    networks:
      - placeintime-network # Rede do container

  postgres:
    image: postgres:15-alpine
    container_name: placeintime-postgres
    environment:
      - POSTGRES_DB=placeintime
      - POSTGRES_USER=placeintime_user
      - POSTGRES_PASSWORD=placeintime_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - placeintime-network

volumes:
  postgres_data:

networks:
  placeintime-network:
    driver: bridge

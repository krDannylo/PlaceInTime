server:
  port: ${SERVER_PORT:8080}
  environment: ${SERVER_ENVIRONMENT:localhost}
  version: ${SERVER_VERSION:1.0.0}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  name: ${APP_NAME:PlaceInTime}
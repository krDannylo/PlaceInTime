server:
  port: ${SERVER_PORT:8080}
  environment: ${SERVER_ENVIRONMENT:localhost}
  version: ${SERVER_VERSION:1.0.0}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/placeintime}
    username: ${DB_USER:placeintime_user}
    password: ${DB_PASS:placeintime_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jwt:
    secret: sua-chave-secreta-muito-longa-com-256bits-aqui
    expiration: 3600000
app:
  name: ${APP_NAME:PlaceInTime}